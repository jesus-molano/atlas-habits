name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${ANDROID_SDK}" || ! -d "${ANDROID_SDK}" ]]; then
            echo "Android SDK root is unavailable" >&2
            exit 1
          fi
          ANDROID_SDK="$(realpath "${ANDROID_SDK}")"
          SDKMANAGER="${ANDROID_SDK}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER=""
            if [[ -d "${ANDROID_SDK}/cmdline-tools" ]]; then
              SDKMANAGER="$(find "${ANDROID_SDK}/cmdline-tools" -type f -name sdkmanager -perm -u+x | sort -V | tail -n 1)"
            fi
          fi
          if [[ -z "${SDKMANAGER}" || ! -x "${SDKMANAGER}" ]]; then
            echo "sdkmanager was not found under ${ANDROID_SDK}" >&2
            exit 1
          fi
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "${ANDROID_SDK}" "${ANDROID_SDK}" >> "${GITHUB_ENV}"
          "${SDKMANAGER}" --sdk_root="${ANDROID_SDK}" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Bundle Android JavaScript
        run: npx expo export --platform android --output-dir dist/export

      - name: Generate Android project without Firebase
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compile Android debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: android
