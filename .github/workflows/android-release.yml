name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-release
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    env:
      ATLAS_ANDROID_PACKAGE: atlas_habits.com
      ATLAS_FIREBASE_APP_ID: '1:311177750419:android:ab3761d13f5c5fc38aea66'
      ATLAS_FIREBASE_PROJECT_ID: atlas-habits
      ATLAS_FIREBASE_PROJECT_NUMBER: '311177750419'
      ATLAS_FIREBASE_WEB_CLIENT_ID: 311177750419-q0ehuf7pc9o8kcsioi0kb23ml7hji5nh.apps.googleusercontent.com
      ATLAS_RELEASE_CERT_SHA1: '6C:B1:3B:61:1A:35:06:86:1F:1A:9D:48:73:B5:BE:C2:3A:3B:F8:B1'
      ATLAS_RELEASE_CERT_SHA256: 'C6:3D:79:32:4E:5F:7D:8D:0B:A7:9B:14:94:35:C0:09:DE:89:9F:E3:52:0A:E4:87:61:C2:15:9D:53:3F:46:76'
    steps:
      - name: Resolve tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RELEASE_TAG="${DISPATCH_TAG}"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          printf 'tag=%s\n' "${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${ANDROID_SDK}" || ! -d "${ANDROID_SDK}" ]]; then
            echo "Android SDK root is unavailable" >&2
            exit 1
          fi
          ANDROID_SDK="$(realpath "${ANDROID_SDK}")"
          SDKMANAGER="${ANDROID_SDK}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER=""
            if [[ -d "${ANDROID_SDK}/cmdline-tools" ]]; then
              SDKMANAGER="$(find "${ANDROID_SDK}/cmdline-tools" -type f -name sdkmanager -perm -u+x | sort -V | tail -n 1)"
            fi
          fi
          if [[ -z "${SDKMANAGER}" || ! -x "${SDKMANAGER}" ]]; then
            echo "sdkmanager was not found under ${ANDROID_SDK}" >&2
            exit 1
          fi
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "${ANDROID_SDK}" "${ANDROID_SDK}" >> "${GITHUB_ENV}"
          "${SDKMANAGER}" --sdk_root="${ANDROID_SDK}" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci

      - name: Verify version and tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG}" = "v${APP_VERSION}"
          test "$(npx expo config --json | jq -r .version)" = "${APP_VERSION}"
          test "$(npx expo config --json | jq -r .android.versionCode)" -gt 0

      - name: Validate source
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "${KEYSTORE_BASE64}"
          test -n "${STORE_PASSWORD}"
          test -n "${KEY_ALIAS}"
          test -n "${KEY_PASSWORD}"

      - name: Restore and validate release keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/atlas-release.jks"
          test -s "${RUNNER_TEMP}/atlas-release.jks"

          CERTIFICATE_SHA1="$(keytool -exportcert \
            -keystore "${RUNNER_TEMP}/atlas-release.jks" \
            -storepass:env STORE_PASSWORD \
            -alias "${KEY_ALIAS}" | sha1sum | awk '{ print toupper($1) }')"
          CERTIFICATE_SHA256="$(keytool -exportcert \
            -keystore "${RUNNER_TEMP}/atlas-release.jks" \
            -storepass:env STORE_PASSWORD \
            -alias "${KEY_ALIAS}" | sha256sum | awk '{ print toupper($1) }')"
          EXPECTED_SHA1="${ATLAS_RELEASE_CERT_SHA1//:/}"
          EXPECTED_SHA256="${ATLAS_RELEASE_CERT_SHA256//:/}"
          test -n "${CERTIFICATE_SHA1}"
          test -n "${CERTIFICATE_SHA256}"
          test "${CERTIFICATE_SHA1}" = "${EXPECTED_SHA1}"
          test "${CERTIFICATE_SHA256}" = "${EXPECTED_SHA256}"
          printf 'certificate_sha1=%s\n' "${CERTIFICATE_SHA1}" >> "$GITHUB_OUTPUT"
          printf 'certificate_sha256=%s\n' "${CERTIFICATE_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Restore and validate Google services configuration
        id: firebase
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_SERVICES_FILE: ${{ runner.temp }}/google-services.json
          RELEASE_CERT_SHA1: ${{ steps.signing.outputs.certificate_sha1 }}
        run: |
          test -n "${GOOGLE_SERVICES_BASE64}"
          umask 077
          printf '%s' "${GOOGLE_SERVICES_BASE64}" | base64 --decode > "${GOOGLE_SERVICES_FILE}"
          test -s "${GOOGLE_SERVICES_FILE}"
          node - <<'NODE'
          const fs = require('node:fs');

          const requiredEnvironment = [
            'ATLAS_ANDROID_PACKAGE',
            'ATLAS_FIREBASE_APP_ID',
            'ATLAS_FIREBASE_PROJECT_ID',
            'ATLAS_FIREBASE_PROJECT_NUMBER',
            'ATLAS_FIREBASE_WEB_CLIENT_ID',
            'GOOGLE_SERVICES_FILE',
            'GITHUB_ENV',
            'RELEASE_CERT_SHA1',
          ];
          for (const name of requiredEnvironment) {
            if (!process.env[name]) throw new Error(`${name} is required`);
          }

          const normalizeFingerprint = (value) =>
            typeof value === 'string'
              ? value.replaceAll(':', '').trim().toUpperCase()
              : '';
          const assertSafeEnvironmentValue = (name, value) => {
            if (typeof value !== 'string' || !value || /[\r\n]/u.test(value)) {
              throw new Error(`${name} is missing or invalid`);
            }
            return value;
          };

          const config = JSON.parse(fs.readFileSync(process.env.GOOGLE_SERVICES_FILE, 'utf8'));
          const projectInfo = config.project_info;
          if (
            projectInfo?.project_id !== process.env.ATLAS_FIREBASE_PROJECT_ID ||
            String(projectInfo?.project_number) !== process.env.ATLAS_FIREBASE_PROJECT_NUMBER
          ) {
            throw new Error('google-services.json belongs to a different Firebase project');
          }

          const clients = Array.isArray(config.client) ? config.client : [];
          const matchingClients = clients.filter(
            (client) =>
              client?.client_info?.android_client_info?.package_name === process.env.ATLAS_ANDROID_PACKAGE &&
              client?.client_info?.mobilesdk_app_id === process.env.ATLAS_FIREBASE_APP_ID,
          );
          if (matchingClients.length !== 1) {
            throw new Error('google-services.json must contain exactly one Atlas Android client');
          }

          const [client] = matchingClients;
          const oauthClients = Array.isArray(client.oauth_client) ? client.oauth_client : [];
          const releaseSha1 = normalizeFingerprint(process.env.RELEASE_CERT_SHA1);
          const hasReleaseAndroidClient = oauthClients.some(
            (oauthClient) =>
              oauthClient?.client_type === 1 &&
              oauthClient?.android_info?.package_name === process.env.ATLAS_ANDROID_PACKAGE &&
              normalizeFingerprint(oauthClient?.android_info?.certificate_hash) === releaseSha1,
          );
          if (!hasReleaseAndroidClient) {
            throw new Error('google-services.json does not contain the registered release SHA-1 client');
          }

          const webClientIds = new Set(
            oauthClients
              .filter((oauthClient) => oauthClient?.client_type === 3)
              .map((oauthClient) => oauthClient?.client_id)
              .filter((clientId) => typeof clientId === 'string' && clientId.length > 0),
          );
          if (!webClientIds.has(process.env.ATLAS_FIREBASE_WEB_CLIENT_ID)) {
            throw new Error('google-services.json does not contain the expected Web OAuth client');
          }

          const apiKeys = new Set(
            (Array.isArray(client.api_key) ? client.api_key : [])
              .map((entry) => entry?.current_key)
              .filter((apiKey) => typeof apiKey === 'string' && apiKey.length > 0),
          );
          if (apiKeys.size !== 1) {
            throw new Error('google-services.json must contain exactly one API key for Atlas');
          }

          const [apiKey] = apiKeys;
          const publicEnvironment = {
            EXPO_PUBLIC_FIREBASE_API_KEY: apiKey,
            EXPO_PUBLIC_FIREBASE_APP_ID: process.env.ATLAS_FIREBASE_APP_ID,
            EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: `${process.env.ATLAS_FIREBASE_PROJECT_ID}.firebaseapp.com`,
            EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: process.env.ATLAS_FIREBASE_PROJECT_NUMBER,
            EXPO_PUBLIC_FIREBASE_PROJECT_ID: process.env.ATLAS_FIREBASE_PROJECT_ID,
            EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: process.env.ATLAS_FIREBASE_WEB_CLIENT_ID,
          };
          const lines = Object.entries(publicEnvironment).map(([name, value]) =>
            `${name}=${assertSafeEnvironmentValue(name, value)}`,
          );
          fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join('\n')}\n`, {
            encoding: 'utf8',
            mode: 0o600,
          });
          NODE
          printf 'google_services_file=%s\n' "${GOOGLE_SERVICES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Generate Android project
        env:
          ATLAS_GOOGLE_SERVICES_FILE: ${{ steps.firebase.outputs.google_services_file }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build signed APK
        env:
          ATLAS_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ATLAS_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ATLAS_RELEASE_STORE_FILE: ${{ runner.temp }}/atlas-release.jks
          ATLAS_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
        working-directory: android

      - name: Verify and package APK
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/atlas.apk
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "${APKSIGNER}"
          test -x "${AAPT}"

          VERIFY_OUTPUT="$("${APKSIGNER}" verify --verbose --print-certs dist/atlas.apk)"
          printf '%s\n' "${VERIFY_OUTPUT}"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "${VERIFY_OUTPUT}" | awk -F': ' '/certificate SHA-256 digest:/ { print toupper($NF); exit }')"
          EXPECTED_CERT_SHA256="$(keytool -exportcert \
            -keystore "${RUNNER_TEMP}/atlas-release.jks" \
            -storepass:env STORE_PASSWORD \
            -alias "${KEY_ALIAS}" | sha256sum | awk '{ print toupper($1) }')"
          PINNED_CERT_SHA256="${ATLAS_RELEASE_CERT_SHA256//:/}"
          test -n "${ACTUAL_CERT_SHA256}"
          test "${ACTUAL_CERT_SHA256}" = "${EXPECTED_CERT_SHA256}"
          test "${ACTUAL_CERT_SHA256}" = "${PINNED_CERT_SHA256}"

          BADGING="$("${AAPT}" dump badging dist/atlas.apk)"
          APK_PACKAGE="$(printf '%s\n' "${BADGING}" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          APK_VERSION_CODE="$(printf '%s\n' "${BADGING}" | sed -n "s/^package:.* versionCode='\([^']*\)'.*/\1/p")"
          APK_VERSION_NAME="$(printf '%s\n' "${BADGING}" | sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p")"
          APK_MIN_SDK="$(printf '%s\n' "${BADGING}" | sed -n "s/^sdkVersion:'\([^']*\)'.*/\1/p")"
          APK_TARGET_SDK="$(printf '%s\n' "${BADGING}" | sed -n "s/^targetSdkVersion:'\([^']*\)'.*/\1/p")"
          EXPECTED_VERSION_CODE="$(npx expo config --json | jq -r .android.versionCode)"
          EXPECTED_VERSION_NAME="${RELEASE_TAG#v}"
          test "${APK_PACKAGE}" = "${ATLAS_ANDROID_PACKAGE}"
          test "${APK_VERSION_CODE}" = "${EXPECTED_VERSION_CODE}"
          test "${APK_VERSION_NAME}" = "${EXPECTED_VERSION_NAME}"
          test "${APK_MIN_SDK}" = "36"
          test "${APK_TARGET_SDK}" = "36"
          if printf '%s\n' "${BADGING}" | grep -q '^application-debuggable'; then
            echo "Release APK is debuggable" >&2
            exit 1
          fi

          APK_PERMISSIONS="$("${AAPT}" dump permissions dist/atlas.apk)"
          printf '%s\n' "${APK_PERMISSIONS}" | grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES'
          printf '%s\n' "${APK_PERMISSIONS}" | grep -Fq 'android.permission.SCHEDULE_EXACT_ALARM'
          for forbidden_permission in \
            android.permission.READ_EXTERNAL_STORAGE \
            android.permission.SYSTEM_ALERT_WINDOW \
            android.permission.WRITE_EXTERNAL_STORAGE; do
            if printf '%s\n' "${APK_PERMISSIONS}" | grep -Fq "${forbidden_permission}"; then
              echo "Forbidden permission in Release APK: ${forbidden_permission}" >&2
              exit 1
            fi
          done

          (cd dist && sha256sum atlas.apk > atlas.apk.sha256)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-${{ steps.release.outputs.tag }}
          path: |
            dist/atlas.apk
            dist/atlas.apk.sha256
          if-no-files-found: error

      - name: Remove restored credentials
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/atlas-release.jks"
          rm -f "${RUNNER_TEMP}/google-services.json"
          rm -f android/app/google-services.json

  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlas-${{ needs.release.outputs.tag }}
          path: dist

      - name: Verify downloaded artifact
        run: |
          test -s dist/atlas.apk
          test -s dist/atlas.apk.sha256
          (cd dist && sha256sum --check atlas.apk.sha256)

      - name: Publish GitHub Release
        run: |
          APP_VERSION="${RELEASE_TAG#v}"
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --draft \
              --generate-notes \
              --title "Atlas ${APP_VERSION}" \
              --verify-tag
          fi
          gh release upload "${RELEASE_TAG}" \
            dist/atlas.apk dist/atlas.apk.sha256 \
            --clobber
          gh release edit "${RELEASE_TAG}" --draft=false --latest
